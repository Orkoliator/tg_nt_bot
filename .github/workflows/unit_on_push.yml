name: Unit tests on push

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    environment: Test_env
    env:
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      NT_INTERNAL_OAUTH_SECRET: ${{ secrets.NT_INTERNAL_OAUTH_SECRET }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LOCAL_DB_FILE: ${{ vars.LOCAL_DB_FILE }}

    name: tests
    steps:

      - name: Checkout repository 
        uses: actions/checkout@v6 

      - name: Set up Python ${{ vars.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.python_version }}
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run googai module unit tests
        run: |
          pytest tests/interface_googai_test.py

      - name: Run notion module unit tests
        run: |
          pytest tests/interface_notion_test.py